<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Interactive maritime quiz with increasing difficulty."
  >

  <title>Maritime Quiz</title>

  <style>
    :root {
      --navy: #071d35;
      --navy-light: #123f67;
      --blue: #1479c9;
      --blue-light: #39a5e8;
      --background: #edf3f8;
      --card: #ffffff;
      --text: #172636;
      --muted: #68798b;
      --border: #d8e2eb;
      --success: #1d8047;
      --success-light: #edf9f2;
      --error: #b93a44;
      --error-light: #fff1f2;
      --shadow: 0 18px 45px rgba(7, 29, 53, 0.14);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          var(--navy) 0,
          var(--navy-light) 330px,
          var(--background) 330px
        );
    }

    button,
    a {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(57, 165, 232, 0.45);
      outline-offset: 3px;
    }

    .topbar {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      font-size: 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.1);
    }

    .back-link {
      color: #d8e7f2;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: white;
    }

    .quiz-shell {
      width: min(920px, calc(100% - 32px));
      margin: 18px auto 70px;
    }

    .quiz-header {
      margin-bottom: 24px;
      color: white;
      text-align: center;
    }

    .quiz-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 15px;
      padding: 8px 14px;
      color: #d3ecff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .quiz-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .quiz-subtitle {
      max-width: 630px;
      margin: 13px auto 0;
      color: #cfdeea;
      line-height: 1.6;
    }

    .quiz-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .progress-section {
      padding: 23px 28px 21px;
      border-bottom: 1px solid var(--border);
      background: #f8fbfd;
    }

    .progress-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 999px;
      background: #e8f1f8;
      color: #35546e;
    }

    .difficulty-badge.easy {
      color: #17683b;
      background: #e8f7ef;
    }

    .difficulty-badge.medium {
      color: #835a08;
      background: #fff5d9;
    }

    .difficulty-badge.hard {
      color: #9a3038;
      background: #ffebed;
    }

    .progress-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe8ef;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--blue-light)
        );
      transition: width 0.35s ease;
    }

    .question-area {
      padding: 35px 35px 39px;
    }

    .question-kicker {
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .question-text {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.32;
    }

    .question-image {
      width: 100%;
      max-height: 390px;
      margin-top: 25px;
      display: none;
      object-fit: cover;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #e7eef4;
    }

    .answers {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }

    .answer-button {
      position: relative;
      width: 100%;
      min-height: 62px;
      padding: 16px 18px 16px 58px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .answer-button::before {
      content: attr(data-letter);
      position: absolute;
      left: 17px;
      top: 50%;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: #42627d;
      font-size: 0.78rem;
      font-weight: 800;
      border-radius: 8px;
      background: #eef4f8;
      transform: translateY(-50%);
    }

    .answer-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: #f5faff;
      box-shadow: 0 8px 20px rgba(20, 121, 201, 0.1);
    }

    .answer-button:disabled {
      cursor: default;
    }

    .answer-button.correct {
      color: #145f36;
      border-color: #38a969;
      background: var(--success-light);
    }

    .answer-button.correct::before {
      color: white;
      background: #38a969;
    }

    .answer-button.incorrect {
      color: #982f38;
      border-color: #dc6972;
      background: var(--error-light);
    }

    .answer-button.incorrect::before {
      color: white;
      background: #dc6972;
    }

    .feedback {
      display: none;
      margin-top: 22px;
      padding: 18px 20px;
      line-height: 1.65;
      border-radius: 14px;
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
    }

    .feedback.correct {
      display: block;
      color: #155f36;
      border: 1px solid #a7d9bb;
      background: var(--success-light);
    }

    .feedback.incorrect {
      display: block;
      color: #922f37;
      border: 1px solid #e3a7ac;
      background: var(--error-light);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 27px;
    }

    .next-button,
    .restart-button,
    .home-button {
      min-height: 49px;
      padding: 0 22px;
      color: white;
      font-weight: 800;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-light)
        );
      box-shadow: 0 9px 22px rgba(20, 121, 201, 0.25);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .next-button:hover,
    .restart-button:hover,
    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(20, 121, 201, 0.31);
    }

    .next-button {
      display: none;
    }

    .result-card {
      display: none;
      padding: 48px 34px;
      text-align: center;
    }

    .result-icon {
      font-size: 3.7rem;
    }

    .result-card h2 {
      margin: 19px 0 10px;
      color: var(--navy);
      font-size: 2rem;
    }

    .result-score {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 1.55rem;
      font-weight: 800;
    }

    .result-message {
      max-width: 550px;
      margin: 0 auto 26px;
      color: var(--muted);
      line-height: 1.7;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--navy);
      text-decoration: none;
      border: 1px solid var(--border);
      background: white;
      box-shadow: none;
    }

    .home-button:hover {
      box-shadow: 0 9px 22px rgba(7, 29, 53, 0.1);
    }

    .error-message {
      padding: 34px;
      color: #922f37;
      text-align: center;
      line-height: 1.65;
      border: 1px solid #e4b3b7;
      border-radius: 16px;
      background: var(--error-light);
    }

    @media (max-width: 620px) {
      .topbar {
        padding-top: 16px;
      }

      .brand span:last-child {
        display: none;
      }

      .back-link {
        font-size: 0.82rem;
      }

      .quiz-shell {
        margin-top: 12px;
      }

      .quiz-header {
        text-align: left;
      }

      .quiz-subtitle {
        margin-left: 0;
      }

      .progress-section,
      .question-area {
        padding-left: 21px;
        padding-right: 21px;
      }

      .question-area {
        padding-top: 27px;
      }

      .progress-details {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
      }

      .answer-button {
        min-height: 58px;
        padding-left: 55px;
      }

      .controls {
        justify-content: stretch;
      }

      .next-button {
        width: 100%;
      }

      .result-actions {
        flex-direction: column;
      }

      .restart-button,
      .home-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🚢</div>
      <span>Maritime Learning Portal</span>
    </div>

    <a class="back-link" href="index.html">
      ← Back to quizzes
    </a>
  </header>

  <main class="quiz-shell">

    <section class="quiz-header">
      <div class="quiz-label">
        ⚓ Interactive maritime quiz
      </div>

      <h1 class="quiz-title" id="quiz-title">
        Loading quiz...
      </h1>

      <p class="quiz-subtitle">
        The questions become progressively more difficult.
        Select the answer you believe is correct.
      </p>
    </section>

    <section class="quiz-card">

      <div id="quiz-content">

        <div class="progress-section">
          <div class="progress-details">

            <span id="question-counter">
              Question 1
            </span>

            <span
              class="difficulty-badge"
              id="difficulty-badge"
            >
              Easy
            </span>

            <span id="score-counter">
              Score: 0
            </span>

          </div>

          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progress-fill"
            ></div>
          </div>
        </div>

        <div class="question-area">

          <div
            class="question-kicker"
            id="question-kicker"
          >
            Question
          </div>

          <h2
            class="question-text"
            id="question-text"
          ></h2>

          <img
            class="question-image"
            id="question-image"
            src=""
            alt=""
          >

          <div
            class="answers"
            id="answers"
          ></div>

          <div
            class="feedback"
            id="feedback"
          ></div>

          <div class="controls">
            <button
              class="next-button"
              id="next-button"
              type="button"
            >
              Next question →
            </button>
          </div>

        </div>
      </div>

      <div
        class="result-card"
        id="result-card"
      >
        <div class="result-icon">⚓</div>

        <h2>Quiz completed</h2>

        <p
          class="result-score"
          id="result-score"
        ></p>

        <p
          class="result-message"
          id="result-message"
        ></p>

        <div class="result-actions">

          <button
            class="restart-button"
            id="restart-button"
            type="button"
          >
            Try again
          </button>

          <a
            class="home-button"
            href="index.html"
          >
            Back to quizzes
          </a>

        </div>
      </div>

    </section>
  </main>

  <script>
    const quizFiles = {
      "marine-diesel-engine": {
        file: "data/marine-diesel-engine.json",
        fallbackTitle: "Marine Diesel Engines"
      },

      "ballast-water": {
        file: "data/ballast-water.json",
        fallbackTitle: "Ballast Water"
      },

      "bulk-carrier-design": {
        file: "data/bulk-carrier-design.json",
        fallbackTitle: "Bulk Carrier Design"
      }
    };

    const params =
      new URLSearchParams(window.location.search);

    const quizKey =
      params.get("quiz");

    const selectedQuiz =
      quizFiles[quizKey];

    const quizTitle =
      document.getElementById("quiz-title");

    const questionCounter =
      document.getElementById("question-counter");

    const scoreCounter =
      document.getElementById("score-counter");

    const difficultyBadge =
      document.getElementById("difficulty-badge");

    const progressFill =
      document.getElementById("progress-fill");

    const questionKicker =
      document.getElementById("question-kicker");

    const questionText =
      document.getElementById("question-text");

    const questionImage =
      document.getElementById("question-image");

    const answersContainer =
      document.getElementById("answers");

    const feedback =
      document.getElementById("feedback");

    const nextButton =
      document.getElementById("next-button");

    const quizContent =
      document.getElementById("quiz-content");

    const resultCard =
      document.getElementById("result-card");

    const resultScore =
      document.getElementById("result-score");

    const resultMessage =
      document.getElementById("result-message");

    const restartButton =
      document.getElementById("restart-button");

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    async function loadQuiz() {
      if (!selectedQuiz) {
        showError(
          "The selected quiz could not be found. Return to the home page and choose a valid quiz."
        );

        return;
      }

      quizTitle.textContent =
        selectedQuiz.fallbackTitle;

      document.title =
        `${selectedQuiz.fallbackTitle} | Maritime Learning Portal`;

      try {
        const response = await fetch(
          selectedQuiz.file,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `The quiz file returned status ${response.status}.`
          );
        }

        const data =
          await response.json();

        if (Array.isArray(data)) {
          questions = data;
        } else if (
          data &&
          Array.isArray(data.questions)
        ) {
          questions = data.questions;

          if (data.title) {
            quizTitle.textContent =
              data.title;

            document.title =
              `${data.title} | Maritime Learning Portal`;
          }
        } else {
          throw new Error(
            "The JSON file does not contain a valid questions list."
          );
        }

        if (questions.length === 0) {
          throw new Error(
            "The quiz contains no questions."
          );
        }

        validateQuestions();
        showQuestion();

      } catch (error) {
        console.error(
          "Quiz loading error:",
          error
        );

        showError(
          `The quiz could not be loaded. ${error.message}`
        );
      }
    }

    function validateQuestions() {
      questions.forEach(
        (question, index) => {
          const answers =
            question.answers ||
            question.options;

          const correctIndex =
            question.correct ??
            question.answer;

          if (
            !question.question ||
            !Array.isArray(answers) ||
            answers.length < 2 ||
            !Number.isInteger(correctIndex) ||
            correctIndex < 0 ||
            correctIndex >= answers.length
          ) {
            throw new Error(
              `Question ${index + 1} has an invalid format.`
            );
          }
        }
      );
    }

    function getAnswers(question) {
      return (
        question.answers ||
        question.options
      );
    }

    function getCorrectIndex(question) {
      return (
        question.correct ??
        question.answer
      );
    }

    function getDifficulty(index, total) {
      const position =
        (index + 1) / total;

      if (position <= 0.25) {
        return {
          label: "Easy",
          className: "easy"
        };
      }

      if (position <= 0.5) {
        return {
          label: "Medium",
          className: "medium"
        };
      }

      return {
        label: "Difficult",
        className: "hard"
      };
    }

    function showQuestion() {
      answered = false;

      feedback.className =
        "feedback";

      feedback.innerHTML =
        "";

      nextButton.style.display =
        "none";

      answersContainer.innerHTML =
        "";

      const question =
        questions[currentQuestionIndex];

      const answers =
        getAnswers(question);

      const totalQuestions =
        questions.length;

      const questionNumber =
        currentQuestionIndex + 1;

      const difficulty =
        getDifficulty(
          currentQuestionIndex,
          totalQuestions
        );

      questionCounter.textContent =
        `Question ${questionNumber} of ${totalQuestions}`;

      scoreCounter.textContent =
        `Score: ${score}`;

      questionKicker.textContent =
        `Question ${questionNumber}`;

      questionText.textContent =
        question.question;

      const difficultyName =
        question.difficulty ||
        difficulty.label;

      difficultyBadge.textContent =
        difficultyName;

      difficultyBadge.className =
        "difficulty-badge";

      const difficultyText =
        difficultyName.toLowerCase();

      if (
        difficultyText.includes("easy")
      ) {
        difficultyBadge.classList.add(
          "easy"
        );
      } else if (
        difficultyText.includes("medium")
      ) {
        difficultyBadge.classList.add(
          "medium"
        );
      } else {
        difficultyBadge.classList.add(
          "hard"
        );
      }

      progressFill.style.width =
        `${(questionNumber / totalQuestions) * 100}%`;

      if (question.image) {
        questionImage.src =
          question.image;

        questionImage.alt =
          question.imageAlt ||
          "Maritime quiz illustration";

        questionImage.style.display =
          "block";

        questionImage.onerror =
          function () {
            questionImage.style.display =
              "none";
          };
      } else {
        questionImage.style.display =
          "none";

        questionImage.removeAttribute(
          "src"
        );
      }

      answers.forEach(
        (answer, index) => {
          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "answer-button";

          button.textContent =
            answer;

          button.dataset.letter =
            String.fromCharCode(
              65 + index
            );

          button.addEventListener(
            "click",
            function () {
              selectAnswer(index);
            }
          );

          answersContainer.appendChild(
            button
          );
        }
      );
    }

    function selectAnswer(
      selectedIndex
    ) {
      if (answered) {
        return;
      }

      answered = true;

      const question =
        questions[currentQuestionIndex];

      const answers =
        getAnswers(question);

      const correctIndex =
        getCorrectIndex(question);

      const buttons =
        answersContainer.querySelectorAll(
          ".answer-button"
        );

      buttons.forEach(
        function (button) {
          button.disabled = true;
        }
      );

      buttons[correctIndex].classList.add(
        "correct"
      );

      if (
        selectedIndex === correctIndex
      ) {
        score += 1;

        feedback.className =
          "feedback correct";

        feedback.innerHTML =
          `<strong>Correct answer</strong>${
            question.explanation ||
            "You selected the correct answer."
          }`;
      } else {
        buttons[selectedIndex].classList.add(
          "incorrect"
        );

        feedback.className =
          "feedback incorrect";

        feedback.innerHTML =
          `<strong>Incorrect answer</strong>${
            question.explanation ||
            `The correct answer is: ${answers[correctIndex]}`
          }`;
      }

      scoreCounter.textContent =
        `Score: ${score}`;

      if (
        currentQuestionIndex ===
        questions.length - 1
      ) {
        nextButton.textContent =
          "View results →";
      } else {
        nextButton.textContent =
          "Next question →";
      }

      nextButton.style.display =
        "inline-flex";
    }

    function nextQuestion() {
      if (!answered) {
        return;
      }

      currentQuestionIndex += 1;

      if (
        currentQuestionIndex <
        questions.length
      ) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizContent.style.display =
        "none";

      resultCard.style.display =
        "block";

      const percentage =
        Math.round(
          (
            score /
            questions.length
          ) * 100
        );

      resultScore.textContent =
        `${score} of ${questions.length} correct · ${percentage}%`;

      if (percentage >= 90) {
        resultMessage.textContent =
          "Excellent result. You demonstrated strong knowledge across both the basic and difficult questions.";
      } else if (
        percentage >= 75
      ) {
        resultMessage.textContent =
          "Very good result. You understand the main principles and handled several difficult questions well.";
      } else if (
        percentage >= 60
      ) {
        resultMessage.textContent =
          "Good foundation. Review the explanations from the more difficult questions and try again.";
      } else if (
        percentage >= 40
      ) {
        resultMessage.textContent =
          "You understand some basic principles, but the medium and difficult sections need more review.";
      } else {
        resultMessage.textContent =
          "This topic needs further review. Read through the explanations and try the quiz again.";
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      answered = false;

      resultCard.style.display =
        "none";

      quizContent.style.display =
        "block";

      showQuestion();
    }

    function showError(message) {
      quizTitle.textContent =
        "Quiz unavailable";

      quizContent.innerHTML =
        `
          <div class="error-message">
            <p>${message}</p>
            <p>
              <a href="index.html">
                Return to the quiz portal
              </a>
            </p>
          </div>
        `;
    }

    nextButton.addEventListener(
      "click",
      nextQuestion
    );

    restartButton.addEventListener(
      "click",
      restartQuiz
    );

    loadQuiz();
  </script>

</body>
</html>
