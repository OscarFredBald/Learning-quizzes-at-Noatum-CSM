<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Maritime Quiz</title>

  <style>
    :root {
      --navy: #071d35;
      --navy-light: #123f67;
      --blue: #1479c9;
      --blue-light: #39a5e8;
      --background: #edf3f8;
      --card: #ffffff;
      --text: #162536;
      --muted: #677789;
      --border: #d7e1ea;
      --success: #1f8a4c;
      --error: #c83f49;
      --shadow: 0 18px 45px rgba(7, 29, 53, 0.14);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          var(--navy) 0,
          var(--navy-light) 310px,
          var(--background) 310px
        );
    }

    button,
    a {
      font: inherit;
    }

    .topbar {
      width: min(1050px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.1);
    }

    .home-link {
      color: #d7e7f3;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover {
      color: white;
    }

    .quiz-shell {
      width: min(900px, calc(100% - 32px));
      margin: 28px auto 70px;
    }

    .quiz-header {
      margin-bottom: 24px;
      color: white;
      text-align: center;
    }

    .quiz-category {
      display: inline-flex;
      margin-bottom: 14px;
      padding: 8px 13px;
      color: #cfeaff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .quiz-title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.03em;
    }

    .quiz-subtitle {
      margin: 12px 0 0;
      color: #cfdeea;
      line-height: 1.6;
    }

    .quiz-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .progress-section {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
      background: #f8fbfd;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .progress-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #dfe8ef;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--blue-light)
        );
      transition: width 0.3s ease;
    }

    .question-area {
      padding: 34px 34px 38px;
    }

    .question-number {
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .question-text {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.45rem, 3vw, 2rem);
      line-height: 1.3;
    }

    .question-image {
      width: 100%;
      max-height: 360px;
      margin-top: 24px;
      display: none;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .answers {
      display: grid;
      gap: 14px;
      margin-top: 30px;
    }

    .answer-button {
      width: 100%;
      min-height: 60px;
      padding: 16px 18px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .answer-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--blue);
      background: #f5faff;
      box-shadow: 0 8px 20px rgba(20, 121, 201, 0.1);
    }

    .answer-button:disabled {
      cursor: default;
    }

    .answer-button.correct {
      color: #125f34;
      border-color: #3aac6b;
      background: #edf9f2;
    }

    .answer-button.incorrect {
      color: #9f2f37;
      border-color: #df6b74;
      background: #fff1f2;
    }

    .feedback {
      display: none;
      margin-top: 22px;
      padding: 17px 19px;
      line-height: 1.6;
      border-radius: 14px;
    }

    .feedback.correct {
      display: block;
      color: #155f36;
      border: 1px solid #a7d9bb;
      background: #edf9f2;
    }

    .feedback.incorrect {
      display: block;
      color: #922f37;
      border: 1px solid #e3a7ac;
      background: #fff1f2;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-top: 26px;
    }

    .next-button,
    .restart-button {
      min-height: 48px;
      padding: 0 22px;
      color: white;
      font-weight: 800;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-light)
        );
      box-shadow: 0 9px 22px rgba(20, 121, 201, 0.25);
    }

    .next-button {
      display: none;
    }

    .result-card {
      display: none;
      padding: 45px 32px;
      text-align: center;
    }

    .result-icon {
      font-size: 3.5rem;
    }

    .result-card h2 {
      margin: 18px 0 10px;
      color: var(--navy);
      font-size: 2rem;
    }

    .result-score {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .result-message {
      max-width: 520px;
      margin: 0 auto 25px;
      color: var(--muted);
      line-height: 1.7;
    }

    .error-message {
      padding: 30px;
      color: #922f37;
      text-align: center;
      border: 1px solid #e4b3b7;
      border-radius: 16px;
      background: #fff1f2;
    }

    @media (max-width: 600px) {
      .topbar {
        padding-top: 16px;
      }

      .home-link {
        font-size: 0.8rem;
      }

      .quiz-shell {
        margin-top: 15px;
      }

      .progress-section,
      .question-area {
        padding-left: 21px;
        padding-right: 21px;
      }

      .question-area {
        padding-top: 27px;
      }

      .answer-button {
        min-height: 56px;
      }

      .controls {
        justify-content: stretch;
      }

      .next-button,
      .restart-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🚢</div>
      <span>Maritime Learning Portal</span>
    </div>

    <a class="home-link" href="index.html">
      ← Back to quizzes
    </a>
  </header>

  <main class="quiz-shell">
    <section class="quiz-header">
      <div class="quiz-category">
        Interactive maritime quiz
      </div>

      <h1 class="quiz-title" id="quiz-title">
        Loading quiz...
      </h1>

      <p class="quiz-subtitle">
        Select the answer you believe is correct.
      </p>
    </section>

    <section class="quiz-card">
      <div id="quiz-content">
        <div class="progress-section">
          <div class="progress-top">
            <span id="question-counter">Question 1</span>
            <span id="score-counter">Score: 0</span>
          </div>

          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progress-fill"
            ></div>
          </div>
        </div>

        <div class="question-area">
          <div class="question-number" id="question-number">
            Question
          </div>

          <h2 class="question-text" id="question-text"></h2>

          <img
            class="question-image"
            id="question-image"
            src=""
            alt=""
          >

          <div class="answers" id="answers"></div>

          <div class="feedback" id="feedback"></div>

          <div class="controls">
            <button
              class="next-button"
              id="next-button"
              type="button"
            >
              Next question →
            </button>
          </div>
        </div>
      </div>

      <div class="result-card" id="result-card">
        <div class="result-icon">⚓</div>

        <h2>Quiz completed</h2>

        <p class="result-score" id="result-score"></p>

        <p class="result-message" id="result-message"></p>

        <button
          class="restart-button"
          id="restart-button"
          type="button"
        >
          Try again
        </button>
      </div>
    </section>
  </main>

  <script>
    const quizFiles = {
      "marine-diesel-engine": {
        file: "data/marine-diesel-engine.json",
        title: "Marine Diesel Engines"
      },
      "ballast-water": {
        file: "data/ballast-water.json",
        title: "Ballast Water"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const quizKey = params.get("quiz");
    const selectedQuiz = quizFiles[quizKey];

    const quizTitle = document.getElementById("quiz-title");
    const questionCounter =
      document.getElementById("question-counter");
    const scoreCounter =
      document.getElementById("score-counter");
    const progressFill =
      document.getElementById("progress-fill");
    const questionNumber =
      document.getElementById("question-number");
    const questionText =
      document.getElementById("question-text");
    const questionImage =
      document.getElementById("question-image");
    const answersContainer =
      document.getElementById("answers");
    const feedback =
      document.getElementById("feedback");
    const nextButton =
      document.getElementById("next-button");
    const quizContent =
      document.getElementById("quiz-content");
    const resultCard =
      document.getElementById("result-card");
    const resultScore =
      document.getElementById("result-score");
    const resultMessage =
      document.getElementById("result-message");
    const restartButton =
      document.getElementById("restart-button");

    let questions = [];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    async function loadQuiz() {
      if (!selectedQuiz) {
        showError(
          "The selected quiz could not be found. Return to the home page and choose a quiz."
        );
        return;
      }

      quizTitle.textContent = selectedQuiz.title;
      document.title =
        `${selectedQuiz.title} | Maritime Learning Portal`;

      try {
        const response = await fetch(selectedQuiz.file);

        if (!response.ok) {
          throw new Error("Quiz file could not be loaded.");
        }

        const data = await response.json();

        questions = Array.isArray(data)
          ? data
          : data.questions;

        if (!Array.isArray(questions) || questions.length === 0) {
          throw new Error("The quiz contains no questions.");
        }

        showQuestion();
      } catch (error) {
        showError(
          "The quiz could not be loaded. Check that the JSON filename and path are correct."
        );

        console.error(error);
      }
    }

    function showQuestion() {
      answered = false;

      feedback.className = "feedback";
      feedback.textContent = "";
      nextButton.style.display = "none";
      answersContainer.innerHTML = "";

      const question = questions[currentQuestion];
      const totalQuestions = questions.length;
      const currentNumber = currentQuestion + 1;

      questionCounter.textContent =
        `Question ${currentNumber} of ${totalQuestions}`;

      scoreCounter.textContent = `Score: ${score}`;

      questionNumber.textContent =
        `Question ${currentNumber}`;

      questionText.textContent = question.question;

      progressFill.style.width =
        `${(currentNumber / totalQuestions) * 100}%`;

      if (question.image) {
        questionImage.src = question.image;
        questionImage.alt =
          question.imageAlt || "Maritime quiz illustration";
        questionImage.style.display = "block";
      } else {
        questionImage.style.display = "none";
        questionImage.removeAttribute("src");
      }

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer-button";
        button.textContent = answer;

        button.addEventListener("click", () => {
          selectAnswer(index);
        });

        answersContainer.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) {
        return;
      }

      answered = true;

      const question = questions[currentQuestion];
      const buttons =
        answersContainer.querySelectorAll(".answer-button");

      buttons.forEach((button) => {
        button.disabled = true;
      });

      const correctIndex = question.correct;

      buttons[correctIndex].classList.add("correct");

      if (selectedIndex === correctIndex) {
        score += 1;

        buttons[selectedIndex].classList.add("correct");

        feedback.className = "feedback correct";
        feedback.textContent =
          question.explanation
            ? `Correct. ${question.explanation}`
            : "Correct answer.";
      } else {
        buttons[selectedIndex].classList.add("incorrect");

        feedback.className = "feedback incorrect";
        feedback.textContent =
          question.explanation
            ? `Not quite. ${question.explanation}`
            : `The correct answer is: ${question.answers[correctIndex]}`;
      }

      scoreCounter.textContent = `Score: ${score}`;

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "View results →"
          : "Next question →";

      nextButton.style.display = "inline-flex";
    }

    function nextQuestion() {
      if (!answered) {
        return;
      }

      currentQuestion += 1;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizContent.style.display = "none";
      resultCard.style.display = "block";

      const percentage =
        Math.round((score / questions.length) * 100);

      resultScore.textContent =
        `${score} of ${questions.length} correct · ${percentage}%`;

      if (percentage >= 90) {
        resultMessage.textContent =
          "Excellent result. You have demonstrated strong knowledge of this maritime subject.";
      } else if (percentage >= 70) {
        resultMessage.textContent =
          "Good result. You understand the main principles, with a few areas available for further review.";
      } else if (percentage >= 50) {
        resultMessage.textContent =
          "A reasonable start. Review the questions you found difficult and try the quiz again.";
      } else {
        resultMessage.textContent =
          "This topic needs more review. Try the quiz again after revisiting the learning material.";
      }
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;

      resultCard.style.display = "none";
      quizContent.style.display = "block";

      showQuestion();
    }

    function showError(message) {
      quizTitle.textContent = "Quiz unavailable";

      quizContent.innerHTML =
        `<div class="error-message">${message}</div>`;
    }

    nextButton.addEventListener("click", nextQuestion);
    restartButton.addEventListener("click", restartQuiz);

    loadQuiz();
  </script>

</body>
</html>
